# The TypeScript gate: types, lint, unit tests, and a production build.
#
# Split from the Python workflow on purpose. Each has its own badge, so a
# red mark says which half of the app broke rather than only that
# something did.
name: TypeScript

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the shipping target; Ubuntu catches path and
        # case-sensitivity mistakes that Windows would hide.
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: npm ci
        env:
          # The Electron binary is only needed to package, not to test.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # Without this the sidecar integration tests skip themselves, and
      # they are the only tests that exercise the Electron-to-Python
      # boundary over a real pipe — the boundary where most of this
      # project's real bugs have been. PyTorch is deliberately not
      # installed: a fixture engine stands in for it, so this stays a
      # short install rather than a two-gigabyte one.
      - name: Install the audio core so the integration tests run
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      - name: Confirm the integration tests will not skip
        working-directory: python
        run: python -c "import sipra_core, numpy, soundfile, scipy; print('integration tests enabled')"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --reporter=json --outputFile=vitest-report.json --reporter=default

      - name: Summarise
        if: always()
        run: node scripts/test-summary.mjs vitest-report.json "TypeScript (${{ matrix.os }})"

      - name: Build renderer and main process
        run: npm run build
