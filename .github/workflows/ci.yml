name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the shipping target; Ubuntu catches path and
        # case-sensitivity mistakes that Windows would hide.
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          # Needed by the stem-vocabulary parity test, which compares the
          # TypeScript and Python definitions by running both.
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        env:
          # The Electron binary is only needed to package, not to test.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build renderer and main process
        run: npm run build

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install audio core
        # Deliberately without the `separation` extra: PyTorch is ~2 GB and
        # the engine contract is covered by a fixture engine instead.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      - name: Lint
        run: python -m ruff check python

      - name: Test
        run: python -m pytest python -q

  package:
    name: Package Windows installer
    runs-on: windows-latest
    needs: [typescript, python]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled helper binaries
        run: node scripts/fetch-binaries.mjs
        env:
          # Set to 0 to build an installer with no downloader in it.
          SIPRA_BUNDLE_YTDLP: ${{ vars.SIPRA_BUNDLE_YTDLP || '1' }}

      - name: Build and package
        run: npm run package
        env:
          NODE_ENV: production

      - uses: actions/upload-artifact@v4
        with:
          name: sipra-windows-installer
          path: release/*.exe
          if-no-files-found: error
