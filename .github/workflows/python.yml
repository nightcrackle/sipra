# The audio core: lint and the full test suite, on every supported Python.
#
# PyTorch is deliberately absent. It is two gigabytes, it would dominate
# every run, and the engine contract it satisfies is covered by a fixture
# engine that produces deterministic stems. What is tested here is
# everything around the model — decoding, rate handling, progress
# reporting, peaks, analysis, the protocol, and the subprocess isolation
# that a packaged Windows build depends on.
name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the audio core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      # The format tests decode real m4a, opus, webm, ogg, mp3 and flac —
      # the path every URL import takes, and the one that had no coverage
      # at all until two releases shipped broken through the gap. They skip
      # themselves without ffmpeg, so this makes a silent skip visible
      # rather than letting it pass for a green run.
      - name: Confirm ffmpeg is present for the decode tests
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
          else
            echo "::warning::ffmpeg not found — the real-format decode tests will skip"
          fi

      - name: Lint
        run: python -m ruff check python

      - name: Test
        run: python -m pytest python -q --junitxml=pytest-report.xml

      - name: Summarise
        if: always()
        run: node scripts/test-summary.mjs pytest-report.xml "Python ${{ matrix.python-version }} (${{ matrix.os }})"
