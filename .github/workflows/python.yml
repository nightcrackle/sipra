# The audio core: lint and the full test suite, on every supported Python.
#
# PyTorch is deliberately absent. It is two gigabytes, it would dominate
# every run, and the engine contract it satisfies is covered by a fixture
# engine that produces deterministic stems. What is tested here is
# everything around the model — decoding, rate handling, progress
# reporting, peaks, analysis, the protocol, and the subprocess isolation
# that a packaged Windows build depends on.
name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the audio core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      - name: Lint
        run: python -m ruff check python

      - name: Test
        run: python -m pytest python -q --junitxml=pytest-report.xml

      - name: Summarise
        if: always()
        run: node scripts/test-summary.mjs pytest-report.xml "Python ${{ matrix.python-version }} (${{ matrix.os }})"
