# Build the Windows installer.
#
# Kept out of the pull-request path: it downloads bundled helper binaries
# and produces a ~200 MB artefact, neither of which belongs on every
# commit. Runs on a version tag, or on request.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gate runs again here rather than trusting that CI was green on
      # this commit. A tag can point anywhere.
      - name: Verify
        run: npm run verify

      - name: Fetch bundled helper binaries
        run: node scripts/fetch-binaries.mjs
        env:
          # Set the repository variable to 0 to build an installer with no
          # downloader in it. See NOTICE.md.
          SIPRA_BUNDLE_YTDLP: ${{ vars.SIPRA_BUNDLE_YTDLP || '1' }}

      - name: Build and package
        run: npm run package
        env:
          NODE_ENV: production

      - uses: actions/upload-artifact@v4
        with:
          name: sipra-windows-installer
          path: release/*.exe
          if-no-files-found: error
