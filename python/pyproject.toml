[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipra-core"
version = "0.9.4"
description = "Local audio separation and analysis core for Sipra"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sipra" }]
keywords = ["audio", "stem-separation", "demucs", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
# The separation engine. Split out so the core can be installed, imported
# and tested without pulling down two gigabytes of PyTorch.
separation = ["demucs>=4.0.1", "torch>=2.1", "torchaudio>=2.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
sipra-core = "sipra_core.__main__:main"

[tool.setuptools.packages.find]
include = ["sipra_core*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning:librosa.*",
    "ignore::UserWarning:pyloudnorm.*",
]
markers = [
    "slow: takes more than a couple of seconds",
    "requires_torch: needs PyTorch and Demucs installed",
    "requires_ffmpeg: needs ffmpeg on PATH",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults are used deliberately
    "SIM108", # ternaries are not always clearer
    # `contextlib.suppress` hides the comment explaining *why* a failure is
    # being swallowed, and those comments are load-bearing here (progress
    # callbacks and device probes must never sink a running job).
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
